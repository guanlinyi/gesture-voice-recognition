<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">第一页｜识别与交互</title>
<desc id="desc">按当前程序布局绘制的界面示意，非运行截图。对话、模型名和素材列表均为示例，未使用采集图片或视频。</desc>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif">
<rect x="0" y="0" width="1600" height="1000" rx="0" fill="#eef1f4" stroke="none"/>
<rect x="0" y="0" width="1600" height="60" rx="0" fill="#152131" stroke="none"/>
<text x="24" y="39" font-size="25" fill="#ffffff" font-weight="bold">第一页｜识别与交互</text>
<text x="940" y="38" font-size="20" fill="#bdccda" font-weight="normal">界面示意 · 非运行截图 · 摄像头画面留空</text>
<rect x="12" y="74" width="1576" height="830" rx="6" fill="#efefef" stroke="#aeb8c3"/>
<text x="30" y="112" font-size="20" fill="#263445" font-weight="normal">选择模型</text>
<rect x="128" y="82" width="290" height="42" rx="3" fill="#ffffff" stroke="#b9c2cc"/>
<text x="140" y="110" font-size="19" fill="#263445" font-weight="normal">精简学习模型  ▾</text>
<rect x="432" y="82" width="106" height="42" rx="4" fill="#fafbfc" stroke="#b9c2cc"/><text x="444" y="110" font-size="19" fill="#263445" font-weight="normal">删除模型</text>
<rect x="550" y="82" width="145" height="42" rx="4" fill="#fafbfc" stroke="#b9c2cc"/><text x="562" y="110" font-size="19" fill="#263445" font-weight="normal">验证所选模型</text>
<rect x="707" y="82" width="145" height="42" rx="4" fill="#fafbfc" stroke="#b9c2cc"/><text x="719" y="110" font-size="19" fill="#263445" font-weight="normal">启用所选模型</text>
<rect x="864" y="82" width="202" height="42" rx="4" fill="#fafbfc" stroke="#b9c2cc"/><text x="876" y="110" font-size="19" fill="#263445" font-weight="normal">打开模型学习图片</text>
<text x="1086" y="110" font-size="19" fill="#263445" font-weight="normal">当前使用：精简学习模型</text>
<rect x="24" y="140" width="186" height="46" rx="4" fill="#ffffff" stroke="#b9c2cc"/>
<text x="48" y="171" font-size="22" fill="#263445" font-weight="bold">识别与交互</text>
<rect x="214" y="140" width="160" height="46" rx="4" fill="#e1e5e9" stroke="#b9c2cc"/>
<text x="244" y="171" font-size="22" fill="#263445" font-weight="normal">现场学习</text>
<text x="36" y="224" font-size="24" fill="#263445" font-weight="bold">问答记录</text>
<text x="36" y="260" font-size="19" fill="#263445" font-weight="normal">等待新的语音或手势</text>
<text x="378" y="224" font-size="24" fill="#263445" font-weight="bold">实时视频</text>
<text x="378" y="260" font-size="19" fill="#263445" font-weight="normal">提示音已就绪 · Q / Esc 退出</text>
<rect x="28" y="282" width="326" height="602" rx="3" fill="#152131" stroke="none"/>
<rect x="370" y="282" width="1200" height="602" rx="3" fill="#26323c" stroke="none"/>
<rect x="382" y="294" width="710" height="190" rx="5" fill="#111e2c" stroke="none"/>
<text x="398" y="330" font-size="26" fill="#ffeb00" font-weight="bold">发送方向盘的折叠命令</text>
<text x="398" y="364" font-size="20" fill="#91eac9" font-weight="normal">当前状态：折叠（执行中，待机械臂回报）</text>
<text x="398" y="398" font-size="20" fill="#eef4fb" font-weight="normal">未进入准备状态</text>
<text x="398" y="432" font-size="20" fill="#eef4fb" font-weight="normal">当前识别：握拳 - 折叠命令</text>
<text x="398" y="466" font-size="20" fill="#eef4fb" font-weight="normal">可直接语音下令；手势控制先做 OK</text>
<text x="664" y="625" font-size="27" fill="#a0b0bd" font-weight="normal">实时摄像头画面（此处留空）</text>
<text x="48" y="323" font-size="21" fill="#dce7fa" font-weight="normal">系统：</text>
<text x="48" y="360" font-size="20" fill="#dce7fa" font-weight="normal">您是想要进行方向盘的</text>
<text x="48" y="396" font-size="20" fill="#dce7fa" font-weight="normal">折叠操作吗？</text>
<text x="48" y="463" font-size="21" fill="#8fe0cb" font-weight="normal">用户：是的是的。</text>
<text x="48" y="530" font-size="21" fill="#ffeb00" font-weight="normal">系统：</text>
<text x="48" y="567" font-size="20" fill="#ffeb00" font-weight="normal">发送方向盘的折叠命令</text>
<text x="30" y="944" font-size="23" fill="#263445" font-weight="normal">左侧记录用户和系统问答；右侧显示实时识别、当前状态及命令反馈。</text>
<text x="30" y="980" font-size="20" fill="#526376" font-weight="normal">示例说明：确认成功后会短暂显示黄色发送提示；执行冲突时显示红色拒绝提示。</text>
</g></svg>
